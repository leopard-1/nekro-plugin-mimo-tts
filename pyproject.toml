[project]
name = "nekro-plugin-mimo-tts"
version = "0.2.0"
description = "Nekro-Agent plugin for Xiaomi MiMo-V2.5-TTS speech synthesis"
authors = [{ name = "Sakuralis" }]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10,<3.12"
dependencies = [
    "nekro-agent>=2.0.0",
    "httpx>=0.27.0",
]

[project.urls]
Repository = "https://github.com/leopard-1/nekro-plugin-mimo-tts"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
only-include = [
    "__init__.py",
]

[tool.ruff]
line-length = 128

[tool.ruff.lint]
ignore = [
    "E501",
    "B008",
    "RUF001",
    "RUF002",
    "RUF003",
]
select = ["F", "E", "I", "B", "RUF"]
